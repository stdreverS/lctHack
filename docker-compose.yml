# Демо-запуск: docker compose up -d → http://localhost:8080
#
# Сейчас работает только сервис web: фронтенд в режиме моков (данные хранятся в браузере).
# Закомментированные api и db — целевая схема из трёх контейнеров; включаются, когда
# в backend/src/Robo.Api появятся эндпоинты и backend/Dockerfile (см. docs/deployment.md).

name: robo-platform

services:
  web:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCKS: "true"
    image: robo-platform-web:demo
    ports:
      - "8080:80"
    restart: unless-stopped
