server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Файлы сборки с хешем в имени — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # History-режим Vue Router: любой путь без файла отдаёт index.html (/demo, /app/projects/…)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # API: запросы /api/ уходят в контейнер api (docker-compose.yml).
    # Адрес через переменную и DNS Docker: nginx стартует, даже если api ещё не запущен или
    # его нет вовсе (сборка на моках); тогда /api/ отвечает 502, и фронтенд пишет
    # «Нет связи с сервером» вместо белого экрана.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
